# Систематическая недооценка ресурсов и поток OOM.
#
# Пользователи заказывают карту меньше необходимой; задача стартует,
# упирается в нехватку VRAM и падает с OOMKilled. Если включён
# oom_retry_limit, та же задача ставится заново на карту классом выше —
# ровно то поведение, которое описано в постановке: "пользователи могут
# ставить одну и ту же задачу несколько раз, получая ошибки вроде OOM,
# увеличивая нагрузку на кластер".
#
# Что смотреть: oom_jobs, oom_wasted_gpu_hours, retries, а также насколько
# рекомендатель (cheapest / queue-aware) убирает этот класс ошибок.
name: s09_oom_storm
description: Пользователи недооценивают потребности, задачи падают по OOM
seed: 6060
time_scale: 240
duration_sim_minutes: 600
max_jobs: 350
oom_retry_limit: 2
tenants_preset: sloppy
