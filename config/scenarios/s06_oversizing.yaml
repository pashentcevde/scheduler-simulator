# Пользователи просят карту "с запасом".
#
# Прямая модель проблемы из "Задачи #1". Сценарий с максимальным потенциалом
# для рекомендателя: сравнивать manual против cheapest / queue-aware.
name: s06_oversizing
description: Завышенный запрос класса карты пользователями
seed: 2024
time_scale: 240
duration_sim_minutes: 720
max_jobs: 400
tenants_preset: standard
tenant_overrides:
  a: {oversize_prob: 0.8, undersize_prob: 0.0}
  b: {oversize_prob: 0.8, undersize_prob: 0.0}
  c: {oversize_prob: 0.7, undersize_prob: 0.0}
