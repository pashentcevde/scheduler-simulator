# Асимметричный спрос (слайд "На кластере из 16 H100").
#
# Днём загружена team-a, ночью team-b. Проверяется главный эффект когорты:
# команды по очереди занимают простаивающие карты друг друга.
# Для рекомендателя это сложный сценарий — занятость флейворов меняется
# в течение суток, и решение, оптимальное днём, ночью может быть неверным.
name: s02_asymmetric_demand
description: Дневной пик team-a, ночной пик team-b
seed: 7
time_scale: 240             # сутки за ~12 минут
duration_sim_minutes: 1440
max_jobs: 500
tenants_preset: standard
phases:
  - from_sim_minute: 0      # "день", 08:00-20:00
    to_sim_minute: 720
    rates: {a: 1.9, b: 0.3, c: 0.8}
  - from_sim_minute: 720    # "ночь", 20:00-08:00
    to_sim_minute: 1440
    rates: {a: 0.3, b: 1.9, c: 0.8}
