# Внезапный синхронный наплыв.
#
# Не пуассоновский поток, а резкий всплеск: за несколько сим-минут
# приходит сразу много одинаковых прод-задач (выкатка новой версии модели
# на все инстансы). Проверяется, как ведёт себя допуск и вытеснение,
# когда решения приходится принимать пачкой, и не разваливается ли
# queue-aware из-за того, что все задачи видят одно и то же состояние
# кластера и дружно уходят в один флейвор.
# Средняя нагрузка за прогон здесь низкая — и так и задумано: интерес
# представляет момент всплеска, а не среднее по сценарию.
name: s10_flash_crowd
description: "Синхронная выкатка: пачка одинаковых задач за пару минут"
seed: 808
time_scale: 120              # 1 сим-минута = 2 реальные секунды
duration_sim_minutes: 300
max_jobs: 250
tenants_preset: standard
tenant_overrides:
  a:
    # выкатка одной версии одной модели на много инстансов
    model_mix: {qwen2.5-14b-instruct: 1.0}
    profile_mix: {smoke: 0.3, eval: 0.7}
    oversize_prob: 0.2
phases:
  - from_sim_minute: 0
    to_sim_minute: 60
    rates: {a: 0.5, b: 0.8, c: 0.8}
  - from_sim_minute: 60     # выкатка
    to_sim_minute: 90
    rates: {a: 18.0, b: 0.2, c: 0.2}
  - from_sim_minute: 75
    to_sim_minute: 300
    rates: {a: 0.8, b: 1.0, c: 1.0}
