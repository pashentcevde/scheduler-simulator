# Плотный поток: тот же профиль задач, что в s01, но заявок кратно больше.
#
# ЗАЧЕМ. В s01 средняя загрузка около 66%, а задачи длинные (serving-session
# идёт 2-6 сим-часов). Из-за этого очередь возникает лишь эпизодически:
# заявки успевают отработать по мере поступления, ждать почти некому — и
# сравнивать политики размещения не на чем, все они дают примерно одно и то же.
#
# ЧТО ИЗМЕНЕНО относительно s01, ровно две вещи:
#   1. интенсивность потока поднята втрое (интервал между заявками
#      сокращается с 6.5 до 2.1 сим-минуты);
#   2. микс профилей смещён в сторону коротких задач. Это не косметика:
#      при средней длительности в 3 сим-часа за горизонт прогона успевает
#      смениться меньше трёх "поколений" задач, и статистики по времени
#      ожидания просто не набирается. С короткими задачами кластер
#      прокручивается многократно, очередь то набирается, то рассасывается,
#      и разница между политиками становится измеримой.
# Модели, квантизации, приоритеты и вероятности завышения — как в s01.
#
# КАК ПОДОБРАНА ИНТЕНСИВНОСТЬ. Суммарный спрос держится около 90% ёмкости —
# намеренно НЕ выше 100%. Если перегрузить кластер целиком, никакая политика
# размещения уже не поможет: железа физически не хватает, и все три упрутся
# в одно и то же. Интересный режим другой — ёмкости в сумме хватает, а
# съедает её ПЕРЕКОС ПО ФЛЕЙВОРАМ. При выборе пользователя спрос выглядит так:
#
#   t4 63%   l4 138%   a100-40 76%   a100-80 138%   h100 39%
#
# То есть L4 и A100-80 в дефиците, а H100 наполовину простаивают. Ровно это
# и должен исправлять планировщик. Для справки, чисто стоимостная политика
# cheapest делает перекос хуже (l4 167%, h100 0%) — значит на этом сценарии
# должно быть видно, чем queue-aware отличается от неё.
#
# ЧЕГО ЖДАТЬ. В среднем в кластере одновременно около 29 задач при интервале
# подачи ~2 сим-минуты. Очередь на дефицитных флейворах будет держаться
# постоянно, часть задач может не успеть отработать (starved_jobs) —
# это нормальный результат, а не сбой. Снапшотер, скорее всего, завершится
# по DRAIN_TIMEOUT, а не по признаку разгрузки; при необходимости увеличь:
#   DRAIN_TIMEOUT=1800 ./scripts/run_scenario.sh s13_oversubscribed manual
name: s13_oversubscribed
description: Плотный поток коротких задач, спрос выше ёмкости кластера
seed: 42
time_scale: 120              # 1 сим-минута = 1 реальная секунда
duration_sim_minutes: 480   # 8 сим-часов -> ~8 минут подачи
max_jobs: 700
tenants_preset: standard

tenant_overrides:
  a:
    arrival_per_sim_hour: 10.0
    profile_mix: {smoke: 0.35, eval: 0.5, serving-session: 0.15}
  b:
    arrival_per_sim_hour: 9.5
    profile_mix: {smoke: 0.4, eval: 0.5, serving-session: 0.1}
  c:
    arrival_per_sim_hour: 6.5
    profile_mix: {smoke: 0.35, eval: 0.55, serving-session: 0.1}
