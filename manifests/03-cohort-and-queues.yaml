---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Cohort
metadata:
  name: gpu-shared
 
---

apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: team-a
spec:
  cohortName: gpu-shared
  namespaceSelector:
    matchLabels:
      lab.skalar.ai/tenant: a
  queueingStrategy: BestEffortFIFO
  flavorFungibility:
    whenCanBorrow: TryNextFlavor
    whenCanPreempt: TryNextFlavor
  preemption:
    reclaimWithinCohort: Any
    borrowWithinCohort:
      policy: LowerPriority
      maxPriorityThreshold: 200
    withinClusterQueue: LowerPriority
  resourceGroups:
  - coveredResources:
    - nvidia.com/gpu
    - cpu
    - memory
    flavors:
    - name: gpu-t4
      resources:
      - name: nvidia.com/gpu
        nominalQuota: 2
        borrowingLimit: 6
        lendingLimit: 0
      - name: cpu
        nominalQuota: 16
        borrowingLimit: 48
        lendingLimit: 0
      - name: memory
        nominalQuota: 64Gi
        borrowingLimit: 192Gi
        lendingLimit: 0Gi
    - name: gpu-l4
      resources:
      - name: nvidia.com/gpu
        nominalQuota: 2
        borrowingLimit: 6
        lendingLimit: 0
      - name: cpu
        nominalQuota: 16
        borrowingLimit: 48
        lendingLimit: 0
      - name: memory
        nominalQuota: 64Gi
        borrowingLimit: 192Gi
        lendingLimit: 0Gi
    - name: gpu-a100-40
      resources:
      - name: nvidia.com/gpu
        nominalQuota: 2
        borrowingLimit: 4
        lendingLimit: 1
      - name: cpu
        nominalQuota: 16
        borrowingLimit: 32
        lendingLimit: 8
      - name: memory
        nominalQuota: 64Gi
        borrowingLimit: 128Gi
        lendingLimit: 32Gi
    - name: gpu-a100-80
      resources:
      - name: nvidia.com/gpu
        nominalQuota: 4
        borrowingLimit: 2
        lendingLimit: 1
      - name: cpu
        nominalQuota: 32
        borrowingLimit: 16
        lendingLimit: 8
      - name: memory
        nominalQuota: 128Gi
        borrowingLimit: 64Gi
        lendingLimit: 32Gi
    - name: gpu-h100
      resources:
      - name: nvidia.com/gpu
        nominalQuota: 5
        borrowingLimit: 3
        lendingLimit: 1
      - name: cpu
        nominalQuota: 40
        borrowingLimit: 24
        lendingLimit: 8
      - name: memory
        nominalQuota: 160Gi
        borrowingLimit: 96Gi
        lendingLimit: 32Gi
 
